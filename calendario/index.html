<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Pro - Google Calendar Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">C</div>
                    <h1>Calendar Pro</h1>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Buscar eventos...">
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle">
                    🌙 Modo Escuro
                </button>
                <div class="view-controls">
                    <button class="view-btn active" data-view="month">Mês</button>
                    <button class="view-btn" data-view="week">Semana</button>
                    <button class="view-btn" data-view="day">Dia</button>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <button class="create-event-btn" id="createEventBtn">
                    + Criar Evento
                </button>

                <div class="today-indicator" id="todayIndicator">
                    Hoje: Carregando...
                </div>

                <div class="mini-calendar">
                    <div class="mini-calendar-header">
                        <h3 id="mini-month">Carregando...</h3>
                        <div>
                            <button class="view-btn" id="mini-prev">&lt;</button>
                            <button class="view-btn" id="mini-next">&gt;</button>
                        </div>
                    </div>
                    <div class="mini-calendar-grid" id="mini-calendar-days">
                        <!-- Mini calendar days generated by JS -->
                    </div>
                </div>

                <div class="categories">
                    <h3>Categorias</h3>
                    <div class="category-item active" data-category="all">
                        <div class="category-color" style="background: var(--gray-color);"></div>
                        <span class="category-name">Todos os Eventos</span>
                    </div>
                    <div class="category-item" data-category="trabalho">
                        <div class="category-color" style="background: var(--primary-color);"></div>
                        <span class="category-name">Trabalho</span>
                    </div>
                    <div class="category-item" data-category="pessoal">
                        <div class="category-color" style="background: var(--secondary-color);"></div>
                        <span class="category-name">Pessoal</span>
                    </div>
                    <div class="category-item" data-category="escola">
                        <div class="category-color" style="background: var(--warning-color);"></div>
                        <span class="category-name">Escola</span>
                    </div>
                </div>

                <div class="trash-section">
                    <h3>Lixeira</h3>
                    <div class="trash-content" id="trashContent">
                        <!-- Trash items will be populated here -->
                    </div>
                    <button class="btn btn-danger" id="emptyTrashBtn" style="width: 100%;">Esvaziar Lixeira</button>
                </div>

                <div class="quick-actions">
                    <h3>Ações Rápidas</h3>
                    <button class="quick-action-btn" id="exportBtn">📥 Exportar Eventos</button>
                    <button class="quick-action-btn" id="importBtn">📤 Importar Eventos</button>
                </div>
            </aside>

            <!-- CALENDAR VIEWS -->
            <main class="calendar-view">
                <!-- MONTH VIEW -->
                <div class="month-view" id="month-view">
                    <div class="month-header">
                        <div class="weekday-header">Dom</div>
                        <div class="weekday-header">Seg</div>
                        <div class="weekday-header">Ter</div>
                        <div class="weekday-header">Qua</div>
                        <div class="weekday-header">Qui</div>
                        <div class="weekday-header">Sex</div>
                        <div class="weekday-header">Sáb</div>
                    </div>
                    <div class="month-grid" id="month-grid">
                        <!-- Month grid generated by JS -->
                    </div>
                </div>

                <!-- WEEK VIEW -->
                <div class="week-view hidden" id="week-view">
                    <div class="week-grid" id="week-grid">
                        <!-- Week grid generated by JS -->
                    </div>
                </div>

                <!-- DAY VIEW -->
                <div class="day-view hidden" id="day-view">
                    <div class="day-header-large" id="day-header">
                        <!-- Day header generated by JS -->
                    </div>
                    <div class="day-time-slots" id="day-time-slots">
                        <!-- Day time slots generated by JS -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- EVENT MODAL -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Criar Evento</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="event-type-selector">
                    <button class="event-type-btn active" data-type="event">Evento</button>
                    <button class="event-type-btn" data-type="task">Tarefa</button>
                </div>

                <div class="form-group">
                    <label for="eventTitle">Título *</label>
                    <input type="text" id="eventTitle" class="form-control" placeholder="Adicionar título" required>
                </div>

                <div class="form-row" id="datetime-fields">
                    <div class="form-group">
                        <label for="eventStart">Início</label>
                        <input type="datetime-local" id="eventStart" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="eventEnd">Fim</label>
                        <input type="datetime-local" id="eventEnd" class="form-control">
                    </div>
                </div>

                <div class="form-group" id="task-due-field" style="display: none;">
                    <label for="taskDueDate">Data de Vencimento</label>
                    <input type="date" id="taskDueDate" class="form-control">
                </div>

                <div class="form-group">
                    <label for="eventDescription">Descrição</label>
                    <textarea id="eventDescription" class="form-control" rows="3" placeholder="Adicionar descrição"></textarea>
                </div>

                <div class="form-group">
                    <label for="eventLocation">Local</label>
                    <input type="text" id="eventLocation" class="form-control" placeholder="Adicionar local">
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <div class="color-options">
                        <div class="color-option selected" style="background: var(--primary-color);" data-category="trabalho"></div>
                        <div class="color-option" style="background: var(--secondary-color);" data-category="pessoal"></div>
                        <div class="color-option" style="background: var(--warning-color);" data-category="escola"></div>
                        <div class="color-option" style="background: var(--danger-color);" data-category="saude"></div>
                        <div class="color-option" style="background: var(--purple-color);" data-category="lazer"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventRecurrence">Repetir</label>
                    <select id="eventRecurrence" class="form-control">
                        <option value="none">Não repetir</option>
                        <option value="daily">Diariamente</option>
                        <option value="weekly">Semanalmente</option>
                        <option value="monthly">Mensalmente</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="deleteEvent" style="display: none;">Excluir</button>
                <button class="btn btn-secondary" id="cancelEvent">Cancelar</button>
                <button class="btn btn-primary" id="saveEvent">Salvar</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div class="notification hidden" id="notification">
        <span id="notificationMessage"></span>
    </div>

    <!-- HIDDEN FILE INPUT -->
    <input type="file" id="importFile" accept=".json" style="display: none;">

    <script>
        // O JavaScript permanece exatamente o mesmo
        class CalendarPro {
            constructor() {
                this.currentDate = new Date();
                this.selectedDate = new Date();
                this.currentView = 'month';
                this.events = JSON.parse(localStorage.getItem('calendarProEvents')) || [];
                this.trash = JSON.parse(localStorage.getItem('calendarProTrash')) || [];
                this.editingEvent = null;
                this.selectedCategory = 'all';
                this.isDarkMode = localStorage.getItem('calendarDarkMode') === 'true';
                this.searchTerm = '';
                this.brazilianHolidays = this.generateBrazilianHolidays();
                
                this.init();
            }

            generateBrazilianHolidays() {
                const currentYear = new Date().getFullYear();
                const holidays = {
                    // Feriados fixos
                    [`${currentYear}-01-01`]: "Ano Novo",
                    [`${currentYear}-04-21`]: "Tiradentes",
                    [`${currentYear}-05-01`]: "Dia do Trabalho",
                    [`${currentYear}-09-07`]: "Independência do Brasil",
                    [`${currentYear}-10-12`]: "Nossa Senhora Aparecida",
                    [`${currentYear}-11-02`]: "Finados",
                    [`${currentYear}-11-15`]: "Proclamação da República",
                    [`${currentYear}-12-25`]: "Natal",
                    
                    // Feriados móveis (exemplos para 2024)
                    [`${currentYear}-02-13`]: "Carnaval",
                    [`${currentYear}-03-29`]: "Sexta-Feira Santa",
                    [`${currentYear}-11-20`]: "Dia da Consciência Negra",
                };
                return holidays;
            }

            isHoliday(date) {
                const dateStr = date.toISOString().split('T')[0];
                return this.brazilianHolidays[dateStr];
            }

            init() {
                this.applyTheme();
                this.renderAll();
                this.bindEvents();
                this.renderMiniCalendar();
                this.updateTodayIndicator();
                this.renderTrash();
            }

            updateTodayIndicator() {
                const today = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('todayIndicator').textContent = 
                    `Hoje: ${today.toLocaleDateString('pt-BR', options)}`;
            }

            applyTheme() {
                if (this.isDarkMode) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.getElementById('themeToggle').textContent = '☀️ Modo Claro';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    document.getElementById('themeToggle').textContent = '🌙 Modo Escuro';
                }
            }

            toggleTheme() {
                this.isDarkMode = !this.isDarkMode;
                localStorage.setItem('calendarDarkMode', this.isDarkMode);
                this.applyTheme();
                this.showNotification(`Modo ${this.isDarkMode ? 'escuro' : 'claro'} ativado`);
            }

            renderAll() {
                this.renderMonthView();
                this.renderWeekView();
                this.renderDayView();
                this.updateHeader();
            }

            renderMonthView() {
                const monthGrid = document.getElementById('month-grid');
                if (!monthGrid) return;
                
                monthGrid.innerHTML = '';
                
                const firstDay = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), 1);
                const lastDay = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth() + 1, 0);
                const firstDayIndex = firstDay.getDay();
                const prevMonthLastDay = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), 0).getDate();
                
                // Previous month days
                for (let i = firstDayIndex; i > 0; i--) {
                    const dayElement = this.createDayElement(prevMonthLastDay - i + 1, true);
                    monthGrid.appendChild(dayElement);
                }
                
                // Current month days
                for (let i = 1; i <= lastDay.getDate(); i++) {
                    const dayElement = this.createDayElement(i, false);
                    monthGrid.appendChild(dayElement);
                }
                
                // Next month days
                const totalCells = 42;
                const remainingCells = totalCells - (firstDayIndex + lastDay.getDate());
                for (let i = 1; i <= remainingCells; i++) {
                    const dayElement = this.createDayElement(i, true);
                    monthGrid.appendChild(dayElement);
                }
            }

            createDayElement(dayNumber, isOtherMonth) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                if (isOtherMonth) dayElement.classList.add('other-month');
                
                const dayDate = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), dayNumber);
                
                // Check if today
                const today = new Date();
                if (!isOtherMonth && dayDate.toDateString() === today.toDateString()) {
                    dayElement.classList.add('today');
                }
                
                // Check if holiday
                const holidayName = this.isHoliday(dayDate);
                if (holidayName && !isOtherMonth) {
                    dayElement.classList.add('holiday');
                }

                // Check if has search events
                const hasSearchEvents = this.searchTerm && this.getEventsForDate(dayDate).length > 0;
                if (hasSearchEvents && !isOtherMonth) {
                    dayElement.classList.add('has-search-event');
                }
                
                dayElement.innerHTML = `
                    <div class="day-number">${dayNumber}</div>
                    <div class="day-events" data-date="${dayDate.toISOString().split('T')[0]}"></div>
                `;
                
                this.renderDayEvents(dayElement, dayDate);
                
                dayElement.addEventListener('click', () => {
                    this.selectedDate = dayDate;
                    this.openEventModal(null, dayDate);
                });
                
                return dayElement;
            }

            renderDayEvents(dayElement, dayDate) {
                const eventsContainer = dayElement.querySelector('.day-events');
                const dayEvents = this.getEventsForDate(dayDate);
                
                // Show events count badge
                if (dayEvents.length > 0) {
                    const eventsCount = document.createElement('div');
                    eventsCount.className = 'events-count';
                    eventsCount.textContent = dayEvents.length > 9 ? '9+' : dayEvents.length;
                    dayElement.appendChild(eventsCount);
                }
                
                // Show only first 2-3 events to avoid clutter
                const eventsToShow = dayEvents.slice(0, 3);
                
                eventsToShow.forEach(event => {
                    const eventElement = document.createElement('div');
                    eventElement.className = `event-pill event-${event.category} ${event.type === 'task' ? 'task' : ''}`;
                    
                    // Highlight search term
                    let displayTitle = event.title;
                    if (this.searchTerm && this.searchTerm.length > 2) {
                        const regex = new RegExp(this.searchTerm, 'gi');
                        displayTitle = event.title.replace(regex, match => 
                            `<span class="search-highlight">${match}</span>`
                        );
                    }
                    
                    eventElement.innerHTML = displayTitle;
                    eventElement.setAttribute('data-event-id', event.id);
                    
                    eventElement.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.openEventModal(event);
                    });
                    
                    eventsContainer.appendChild(eventElement);
                });

                // Show holiday
                const holidayName = this.isHoliday(dayDate);
                if (holidayName && !dayElement.classList.contains('other-month')) {
                    const holidayElement = document.createElement('div');
                    holidayElement.className = 'event-pill holiday';
                    holidayElement.textContent = holidayName;
                    eventsContainer.appendChild(holidayElement);
                }
            }

            renderWeekView() {
                const weekGrid = document.getElementById('week-grid');
                if (!weekGrid) return;

                weekGrid.innerHTML = '';

                // Add time column header
                const timeHeader = document.createElement('div');
                timeHeader.className = 'time-slot-header';
                timeHeader.textContent = 'Horário';
                weekGrid.appendChild(timeHeader);

                // Add day headers
                const startOfWeek = new Date(this.currentDate);
                startOfWeek.setDate(this.currentDate.getDate() - this.currentDate.getDay());
                
                for (let i = 0; i < 7; i++) {
                    const day = new Date(startOfWeek);
                    day.setDate(startOfWeek.getDate() + i);
                    
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'day-header';
                    dayHeader.innerHTML = `
                        ${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'][i]}<br>
                        <small>${day.getDate()}</small>
                    `;
                    weekGrid.appendChild(dayHeader);
                }

                // Add time slots
                for (let hour = 0; hour < 24; hour++) {
                    const timeSlot = document.createElement('div');
                    timeSlot.className = 'time-slot';
                    timeSlot.textContent = `${hour.toString().padStart(2, '0')}:00`;
                    weekGrid.appendChild(timeSlot);

                    // Add empty slots for each day
                    for (let i = 0; i < 7; i++) {
                        const daySlot = document.createElement('div');
                        daySlot.className = 'day-column';
                        daySlot.setAttribute('data-hour', hour);
                        daySlot.setAttribute('data-day', i);
                        
                        // Check if has search events for this day and hour
                        const day = new Date(startOfWeek);
                        day.setDate(startOfWeek.getDate() + i);
                        day.setHours(hour, 0, 0, 0);
                        
                        const hasSearchEvents = this.searchTerm && this.getEventsForDateAndHour(day, hour).length > 0;
                        if (hasSearchEvents) {
                            daySlot.classList.add('has-search-event');
                        }
                        
                        weekGrid.appendChild(daySlot);
                    }
                }

                // Render events for the week
                this.renderWeekEvents(startOfWeek);
            }

            renderWeekEvents(startOfWeek) {
                for (let i = 0; i < 7; i++) {
                    const day = new Date(startOfWeek);
                    day.setDate(startOfWeek.getDate() + i);
                    
                    const dayEvents = this.getEventsForDate(day);
                    
                    dayEvents.forEach(event => {
                        if (event.type === 'event' && event.start) {
                            const startDate = new Date(event.start);
                            const endDate = new Date(event.end);
                            
                            const startHour = startDate.getHours();
                            const startMinute = startDate.getMinutes();
                            const endHour = endDate.getHours();
                            const endMinute = endDate.getMinutes();
                            
                            const durationHours = endHour - startHour + (endMinute - startMinute) / 60;
                            const top = (startHour + startMinute / 60) * 40;
                            const height = Math.max(durationHours * 40, 20);
                            
                            const eventElement = document.createElement('div');
                            eventElement.className = `week-event event-${event.category}`;
                            eventElement.style.top = `${top}px`;
                            eventElement.style.height = `${height}px`;
                            eventElement.textContent = event.title;
                            eventElement.setAttribute('data-event-id', event.id);
                            
                            eventElement.addEventListener('click', () => {
                                this.openEventModal(event);
                            });
                            
                            const dayColumn = document.querySelector(`[data-day="${i}"]`);
                            if (dayColumn) {
                                dayColumn.appendChild(eventElement);
                            }
                        }
                    });
                }
            }

            renderDayView() {
                const dayHeader = document.getElementById('day-header');
                const dayTimeSlots = document.getElementById('day-time-slots');
                if (!dayHeader || !dayTimeSlots) return;

                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                dayHeader.textContent = this.selectedDate.toLocaleDateString('pt-BR', options);
                
                dayTimeSlots.innerHTML = '';
                
                // Create time slots for the day
                for (let hour = 0; hour < 24; hour++) {
                    const timeSlot = document.createElement('div');
                    timeSlot.className = 'day-time-slot';
                    
                    const timeLabel = document.createElement('div');
                    timeLabel.className = 'day-time-label';
                    timeLabel.textContent = `${hour.toString().padStart(2, '0')}:00`;
                    
                    const timeContent = document.createElement('div');
                    timeContent.className = 'day-time-content';
                    
                    // Check if has search events for this hour
                    const hasSearchEvents = this.searchTerm && this.getEventsForDateAndHour(this.selectedDate, hour).length > 0;
                    if (hasSearchEvents) {
                        timeSlot.classList.add('has-search-event');
                    }
                    
                    // Add events for this hour
                    const hourEvents = this.getEventsForDateAndHour(this.selectedDate, hour);
                    hourEvents.forEach(event => {
                        const eventElement = document.createElement('div');
                        eventElement.className = `day-event event-${event.category}`;
                        
                        // Highlight search term
                        let displayTitle = event.title;
                        if (this.searchTerm && this.searchTerm.length > 2) {
                            const regex = new RegExp(this.searchTerm, 'gi');
                            displayTitle = event.title.replace(regex, match => 
                                `<span class="search-highlight">${match}</span>`
                            );
                        }
                        
                        eventElement.innerHTML = displayTitle;
                        eventElement.setAttribute('data-event-id', event.id);
                        
                        eventElement.addEventListener('click', () => {
                            this.openEventModal(event);
                        });
                        
                        timeContent.appendChild(eventElement);
                    });
                    
                    timeSlot.appendChild(timeLabel);
                    timeSlot.appendChild(timeContent);
                    dayTimeSlots.appendChild(timeSlot);
                }
            }

            getEventsForDate(date) {
                const dateStr = date.toISOString().split('T')[0];
                let filteredEvents = [];

                // Get all events for this date (including recurring)
                this.events.forEach(event => {
                    const eventDate = new Date(event.start);
                    const eventDateStr = eventDate.toISOString().split('T')[0];
                    
                    // Check if event occurs on this date
                    if (this.doesEventOccurOnDate(event, date)) {
                        filteredEvents.push(event);
                    }
                });

                if (this.selectedCategory !== 'all') {
                    filteredEvents = filteredEvents.filter(event => event.category === this.selectedCategory);
                }

                // Apply search filter
                if (this.searchTerm) {
                    const term = this.searchTerm.toLowerCase();
                    filteredEvents = filteredEvents.filter(event => 
                        event.title.toLowerCase().includes(term) || 
                        (event.description && event.description.toLowerCase().includes(term))
                    );
                }

                return filteredEvents;
            }

            getEventsForDateAndHour(date, hour) {
                const dayEvents = this.getEventsForDate(date);
                return dayEvents.filter(event => {
                    if (event.type === 'event' && event.start) {
                        const eventDate = new Date(event.start);
                        return eventDate.getHours() === hour;
                    }
                    return false;
                });
            }

            doesEventOccurOnDate(event, date) {
                const eventDate = new Date(event.start);
                const checkDate = new Date(date);
                
                // Reset times for date comparison
                eventDate.setHours(0,0,0,0);
                checkDate.setHours(0,0,0,0);

                // Single occurrence event
                if (event.recurrence === 'none' || !event.recurrence) {
                    return eventDate.getTime() === checkDate.getTime();
                }

                // Recurring events - handle holidays
                if (event.recurrence === 'daily') {
                    // Skip if it's a holiday
                    if (this.isHoliday(checkDate)) {
                        return false;
                    }
                    return eventDate <= checkDate;
                }
                
                if (event.recurrence === 'weekly') {
                    // Skip if it's a holiday
                    if (this.isHoliday(checkDate)) {
                        return false;
                    }
                    return eventDate.getDay() === checkDate.getDay() && eventDate <= checkDate;
                }
                
                if (event.recurrence === 'monthly') {
                    // Skip if it's a holiday
                    if (this.isHoliday(checkDate)) {
                        return false;
                    }
                    return eventDate.getDate() === checkDate.getDate() && eventDate <= checkDate;
                }

                return false;
            }

            renderMiniCalendar() {
                const miniDays = document.getElementById('mini-calendar-days');
                const miniMonth = document.getElementById('mini-month');
                
                if (!miniDays || !miniMonth) return;
                
                const monthNames = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
                miniMonth.textContent = `${monthNames[this.currentDate.getMonth()]} ${this.currentDate.getFullYear()}`;
                
                miniDays.innerHTML = '';
                
                const firstDay = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), 1);
                const lastDay = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth() + 1, 0);
                const firstDayIndex = firstDay.getDay();
                const prevMonthLastDay = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), 0).getDate();
                
                // Previous month
                for (let i = firstDayIndex; i > 0; i--) {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'mini-day other-month';
                    dayElement.textContent = prevMonthLastDay - i + 1;
                    miniDays.appendChild(dayElement);
                }
                
                // Current month
                for (let i = 1; i <= lastDay.getDate(); i++) {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'mini-day';
                    
                    const dayDate = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), i);
                    const today = new Date();
                    if (dayDate.toDateString() === today.toDateString()) {
                        dayElement.classList.add('today');
                    }

                    // Check if holiday
                    if (this.isHoliday(dayDate)) {
                        dayElement.classList.add('holiday');
                    }

                    // Check if has search events
                    const hasSearchEvents = this.searchTerm && this.getEventsForDate(dayDate).length > 0;
                    if (hasSearchEvents) {
                        dayElement.classList.add('has-search-event');
                    }
                    
                    dayElement.textContent = i;
                    dayElement.addEventListener('click', () => {
                        this.selectedDate = dayDate;
                        this.currentDate = new Date(dayDate);
                        this.renderAll();
                        this.renderMiniCalendar();
                    });
                    
                    miniDays.appendChild(dayElement);
                }
                
                // Next month
                const totalCells = 42;
                const remainingCells = totalCells - (firstDayIndex + lastDay.getDate());
                for (let i = 1; i <= remainingCells; i++) {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'mini-day other-month';
                    dayElement.textContent = i;
                    miniDays.appendChild(dayElement);
                }
            }

            renderTrash() {
                const trashContent = document.getElementById('trashContent');
                if (!trashContent) return;

                trashContent.innerHTML = '';

                if (this.trash.length === 0) {
                    trashContent.innerHTML = '<p style="text-align: center; color: var(--text-light); font-size: 12px;">Lixeira vazia</p>';
                    return;
                }

                this.trash.forEach((item, index) => {
                    const trashItem = document.createElement('div');
                    trashItem.className = 'trash-item';
                    
                    const eventDate = new Date(item.start);
                    const dateStr = eventDate.toLocaleDateString('pt-BR');
                    
                    trashItem.innerHTML = `
                        <div>
                            <strong>${item.title}</strong><br>
                            <small>${dateStr}</small>
                        </div>
                        <div class="trash-actions">
                            <button class="trash-btn trash-restore" data-index="${index}">Restaurar</button>
                            <button class="trash-btn trash-delete" data-index="${index}">Excluir</button>
                        </div>
                    `;
                    
                    trashContent.appendChild(trashItem);
                });

                // Add event listeners for trash actions
                document.querySelectorAll('.trash-restore').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        this.restoreFromTrash(index);
                    });
                });

                document.querySelectorAll('.trash-delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        this.deleteFromTrash(index);
                    });
                });
            }

            restoreFromTrash(index) {
                if (index >= 0 && index < this.trash.length) {
                    const event = this.trash[index];
                    this.events.push(event);
                    this.trash.splice(index, 1);
                    this.saveToLocalStorage();
                    this.renderAll();
                    this.renderTrash();
                    this.showNotification('Evento restaurado da lixeira');
                }
            }

            deleteFromTrash(index) {
                if (index >= 0 && index < this.trash.length) {
                    this.trash.splice(index, 1);
                    this.saveToLocalStorage();
                    this.renderTrash();
                    this.showNotification('Evento excluído permanentemente');
                }
            }

            emptyTrash() {
                if (this.trash.length === 0) {
                    this.showNotification('A lixeira já está vazia');
                    return;
                }

                if (confirm('Tem certeza que deseja esvaziar a lixeira? Esta ação não pode ser desfeita.')) {
                    this.trash = [];
                    this.saveToLocalStorage();
                    this.renderTrash();
                    this.showNotification('Lixeira esvaziada');
                }
            }

            bindEvents() {
                // Theme toggle
                document.getElementById('themeToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });
                
                // View controls
                document.querySelectorAll('.view-btn[data-view]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const view = e.target.getAttribute('data-view');
                        this.switchView(view);
                    });
                });
                
                // Mini calendar navigation
                document.getElementById('mini-prev').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                    this.renderAll();
                    this.renderMiniCalendar();
                });
                
                document.getElementById('mini-next').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                    this.renderAll();
                    this.renderMiniCalendar();
                });
                
                // Create event button
                document.getElementById('createEventBtn').addEventListener('click', () => {
                    this.openEventModal();
                });
                
                // Modal events
                document.getElementById('closeModal').addEventListener('click', () => {
                    this.closeEventModal();
                });
                
                document.getElementById('cancelEvent').addEventListener('click', () => {
                    this.closeEventModal();
                });
                
                document.getElementById('saveEvent').addEventListener('click', () => {
                    this.saveEvent();
                });
                
                document.getElementById('deleteEvent').addEventListener('click', () => {
                    this.deleteEvent();
                });

                // Empty trash button
                document.getElementById('emptyTrashBtn').addEventListener('click', () => {
                    this.emptyTrash();
                });
                
                // Event type selector
                document.querySelectorAll('.event-type-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.event-type-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.toggleEventType(e.target.dataset.type);
                    });
                });
                
                // Categories
                document.querySelectorAll('.category-item').forEach(item => {
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
                        item.classList.add('active');
                        this.selectedCategory = item.dataset.category;
                        this.renderAll();
                    });
                });
                
                // Color options
                document.querySelectorAll('.color-option').forEach(option => {
                    option.addEventListener('click', () => {
                        document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
                        option.classList.add('selected');
                    });
                });
                
                // Quick actions
                document.getElementById('exportBtn').addEventListener('click', () => {
                    this.exportEvents();
                });
                
                document.getElementById('importBtn').addEventListener('click', () => {
                    document.getElementById('importFile').click();
                });
                
                // File import
                document.getElementById('importFile').addEventListener('change', (e) => {
                    this.importEvents(e);
                });
                
                // Search with debounce
                let searchTimeout;
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        this.searchEvents(e.target.value);
                    }, 300);
                });

                // Close search results when clicking outside
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.search-box')) {
                        document.getElementById('searchResults').classList.remove('active');
                    }
                });
            }

            toggleEventType(type) {
                const datetimeFields = document.getElementById('datetime-fields');
                const taskDueField = document.getElementById('task-due-field');
                
                if (type === 'task') {
                    datetimeFields.style.display = 'none';
                    taskDueField.style.display = 'block';
                } else {
                    datetimeFields.style.display = 'grid';
                    taskDueField.style.display = 'none';
                }
            }

            switchView(view) {
                this.currentView = view;
                
                // Update active button
                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-view="${view}"]`).classList.add('active');
                
                // Show/hide views
                document.getElementById('month-view').classList.toggle('hidden', view !== 'month');
                document.getElementById('week-view').classList.toggle('hidden', view !== 'week');
                document.getElementById('day-view').classList.toggle('hidden', view !== 'day');

                // If switching to day view, set selected date to current date if not already set
                if (view === 'day' && !this.selectedDate) {
                    this.selectedDate = new Date();
                }

                this.renderAll();
            }

            openEventModal(event = null, date = null) {
                this.editingEvent = event;
                const modal = document.getElementById('eventModal');
                const modalTitle = document.getElementById('modalTitle');
                const deleteBtn = document.getElementById('deleteEvent');
                
                if (event) {
                    modalTitle.textContent = 'Editar Evento';
                    deleteBtn.style.display = 'block';
                    this.populateEventForm(event);
                } else {
                    modalTitle.textContent = 'Criar Evento';
                    deleteBtn.style.display = 'none';
                    this.clearEventForm(date);
                }
                
                modal.style.display = 'flex';
            }

            closeEventModal() {
                document.getElementById('eventModal').style.display = 'none';
                this.editingEvent = null;
            }

            populateEventForm(event) {
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDescription').value = event.description || '';
                document.getElementById('eventLocation').value = event.location || '';
                document.getElementById('eventRecurrence').value = event.recurrence || 'none';
                
                // Set event type
                document.querySelectorAll('.event-type-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.type === event.type);
                });
                this.toggleEventType(event.type);
                
                if (event.type === 'event') {
                    document.getElementById('eventStart').value = this.formatDateTimeForInput(event.start);
                    document.getElementById('eventEnd').value = this.formatDateTimeForInput(event.end);
                } else {
                    document.getElementById('taskDueDate').value = event.dueDate ? event.dueDate.split('T')[0] : '';
                }
                
                document.querySelectorAll('.color-option').forEach(opt => {
                    opt.classList.toggle('selected', opt.dataset.category === event.category);
                });
            }

            clearEventForm(date) {
                const defaultStart = date ? new Date(date) : new Date();
                defaultStart.setHours(9, 0, 0, 0);
                
                const defaultEnd = new Date(defaultStart);
                defaultEnd.setHours(10, 0, 0, 0);
                
                document.getElementById('eventTitle').value = '';
                document.getElementById('eventStart').value = this.formatDateTimeForInput(defaultStart);
                document.getElementById('eventEnd').value = this.formatDateTimeForInput(defaultEnd);
                document.getElementById('taskDueDate').value = '';
                document.getElementById('eventDescription').value = '';
                document.getElementById('eventLocation').value = '';
                document.getElementById('eventRecurrence').value = 'none';
                
                // Reset to default event type and category
                document.querySelectorAll('.event-type-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.type === 'event');
                });
                this.toggleEventType('event');
                
                document.querySelectorAll('.color-option').forEach(opt => {
                    opt.classList.toggle('selected', opt.dataset.category === 'trabalho');
                });
            }

            saveEvent() {
                const title = document.getElementById('eventTitle').value.trim();
                if (!title) {
                    alert('Por favor, adicione um título para o evento.');
                    return;
                }

                const eventType = document.querySelector('.event-type-btn.active').dataset.type;
                const formData = {
                    title: title,
                    description: document.getElementById('eventDescription').value.trim(),
                    location: document.getElementById('eventLocation').value.trim(),
                    category: document.querySelector('.color-option.selected').dataset.category,
                    recurrence: document.getElementById('eventRecurrence').value,
                    type: eventType
                };

                if (eventType === 'event') {
                    formData.start = document.getElementById('eventStart').value;
                    formData.end = document.getElementById('eventEnd').value;
                } else {
                    formData.dueDate = document.getElementById('taskDueDate').value;
                    formData.start = formData.dueDate + 'T00:00:00';
                    formData.end = formData.dueDate + 'T23:59:59';
                }

                if (this.editingEvent) {
                    const eventIndex = this.events.findIndex(e => e.id === this.editingEvent.id);
                    if (eventIndex > -1) {
                        this.events[eventIndex] = { ...this.editingEvent, ...formData };
                    }
                } else {
                    const newEvent = {
                        id: Date.now().toString(),
                        ...formData
                    };
                    this.events.push(newEvent);
                }

                this.saveToLocalStorage();
                this.renderAll();
                this.renderMiniCalendar();
                this.closeEventModal();
                this.showNotification(eventType === 'task' ? 'Tarefa salva!' : 'Evento salvo!');
            }

            deleteEvent() {
                if (this.editingEvent && confirm('Tem certeza que deseja excluir este evento?')) {
                    // Move to trash instead of permanent deletion
                    this.trash.push(this.editingEvent);
                    this.events = this.events.filter(e => e.id !== this.editingEvent.id);
                    this.saveToLocalStorage();
                    this.renderAll();
                    this.renderTrash();
                    this.closeEventModal();
                    this.showNotification('Evento movido para a lixeira');
                }
            }

            exportEvents() {
                const dataStr = JSON.stringify(this.events, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(dataBlob);
                link.download = `calendar-events-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                
                this.showNotification('Eventos exportados com sucesso!');
            }

            importEvents(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedEvents = JSON.parse(e.target.result);
                        if (Array.isArray(importedEvents)) {
                            this.events = importedEvents;
                            this.saveToLocalStorage();
                            this.renderAll();
                            this.showNotification('Eventos importados com sucesso!');
                        } else {
                            throw new Error('Formato inválido');
                        }
                    } catch (error) {
                        this.showNotification('Erro ao importar eventos');
                    }
                };
                reader.readAsText(file);
                
                // Reset file input
                event.target.value = '';
            }

            searchEvents(term) {
                this.searchTerm = term.toLowerCase();
                const searchResults = document.getElementById('searchResults');
                
                if (!term) {
                    searchResults.classList.remove('active');
                    this.renderAll();
                    this.renderMiniCalendar();
                    return;
                }

                // Find all matching events across all months
                const matchingEvents = [];
                const currentYear = this.currentDate.getFullYear();
                
                // Search in current year and next/previous year
                for (let year = currentYear - 1; year <= currentYear + 1; year++) {
                    for (let month = 0; month < 12; month++) {
                        const testDate = new Date(year, month, 1);
                        const eventsInMonth = this.getEventsForMonth(testDate);
                        
                        eventsInMonth.forEach(event => {
                            if (event.title.toLowerCase().includes(term) || 
                                (event.description && event.description.toLowerCase().includes(term))) {
                                matchingEvents.push({
                                    event: event,
                                    date: new Date(event.start),
                                    month: month,
                                    year: year
                                });
                            }
                        });
                    }
                }

                // Remove duplicates
                const uniqueEvents = [];
                const seenIds = new Set();
                
                matchingEvents.forEach(item => {
                    if (!seenIds.has(item.event.id)) {
                        seenIds.add(item.event.id);
                        uniqueEvents.push(item);
                    }
                });

                // Display search results
                if (uniqueEvents.length > 0) {
                    let resultsHTML = '';
                    
                    uniqueEvents.forEach(item => {
                        const eventDate = new Date(item.event.start);
                        const formattedDate = eventDate.toLocaleDateString('pt-BR');
                        const monthNames = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
                        const monthName = monthNames[item.month];
                        
                        // Highlight search term in title
                        const highlightedTitle = item.event.title.replace(
                            new RegExp(term, 'gi'), 
                            match => `<span class="search-highlight">${match}</span>`
                        );
                        
                        resultsHTML += `
                            <div class="search-result-item" data-event-id="${item.event.id}" data-date="${eventDate.toISOString().split('T')[0]}">
                                <strong>${highlightedTitle}</strong>
                                <br>
                                <small>${formattedDate} ${item.event.time || ''}</small>
                                <span class="month-indicator">${monthName} ${item.year}</span>
                            </div>
                        `;
                    });
                    
                    searchResults.innerHTML = resultsHTML;
                    searchResults.classList.add('active');
                    
                    // Add click handlers to search results
                    document.querySelectorAll('.search-result-item').forEach(item => {
                        item.addEventListener('click', () => {
                            const eventId = item.getAttribute('data-event-id');
                            const eventDate = new Date(item.getAttribute('data-date'));
                            const event = this.events.find(e => e.id === eventId);
                            
                            if (event) {
                                // Navigate to the event's date
                                this.currentDate = new Date(eventDate);
                                this.selectedDate = new Date(eventDate);
                                this.renderAll();
                                this.renderMiniCalendar();
                                
                                // Open event modal
                                this.openEventModal(event);
                            }
                            
                            searchResults.classList.remove('active');
                            document.getElementById('searchInput').value = '';
                            this.searchTerm = '';
                        });
                    });
                } else {
                    searchResults.innerHTML = '<div class="search-result-item">Nenhum evento encontrado.</div>';
                    searchResults.classList.add('active');
                }

                // Highlight days with matching events in calendar
                this.renderAll();
                this.renderMiniCalendar();
            }

            getEventsForMonth(date) {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                
                return this.events.filter(event => {
                    const eventDate = new Date(event.start);
                    return eventDate >= firstDay && eventDate <= lastDay;
                });
            }

            formatDateTimeForInput(date) {
                if (!(date instanceof Date) || isNaN(date)) {
                    date = new Date();
                }
                return date.toISOString().slice(0, 16);
            }

            showNotification(message) {
                const notification = document.getElementById('notification');
                const messageEl = document.getElementById('notificationMessage');
                
                if (!notification || !messageEl) return;
                
                messageEl.textContent = message;
                notification.classList.remove('hidden');
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        notification.classList.add('hidden');
                    }, 300);
                }, 3000);
            }

            updateHeader() {
                // Header update if needed
            }

            saveToLocalStorage() {
                localStorage.setItem('calendarProEvents', JSON.stringify(this.events));
                localStorage.setItem('calendarProTrash', JSON.stringify(this.trash));
            }
        }

        // Initialize the calendar when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.calendarPro = new CalendarPro();
        });
    </script>
</body>
</html>
